name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate version tag
        id: version
        run: node scripts/prepare-release.mjs --check

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: windows-x64.exe
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            asset: macos-arm64.app.zip
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x64.tar.gz
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64.tar.gz
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Keep temporary files inside the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.local-work/tmp" "$GITHUB_WORKSPACE/.local-work/pnpm"
          # Give pnpm's installer its own workspace so installing application
          # dependencies cannot remove the package manager that is running.
          printf 'packages: []\n' > "$GITHUB_WORKSPACE/.local-work/pnpm/pnpm-workspace.yaml"
          node -e 'const fs = require("node:fs"); const path = require("node:path").join(process.env.GITHUB_WORKSPACE, ".local-work", "tmp"); fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${path}\nTMP=${path}\nTEMP=${path}\n`);'
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ github.workspace }}/.local-work/pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target "$BUILD_TARGET"
          rustup default 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set application version from tag
        run: node scripts/prepare-release.mjs
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and package
        run: pnpm package --target "$BUILD_TARGET"
      - name: Archive macOS app folder
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent artifacts/AMIKVM.app "artifacts/AMIKVM-${RELEASE_VERSION}-macos-arm64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/AMIKVM-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Publish all four packages
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "release-assets/AMIKVM-${RELEASE_VERSION}-windows-x64.exe"
            "release-assets/AMIKVM-${RELEASE_VERSION}-macos-arm64.app.zip"
            "release-assets/AMIKVM-${RELEASE_VERSION}-linux-x64.tar.gz"
            "release-assets/AMIKVM-${RELEASE_VERSION}-linux-arm64.tar.gz"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
