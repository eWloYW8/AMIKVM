[package]
name = "amikvm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
fs2 = "0.4"
openh264 = { version = "0.9.8", features = ["source"] }
mp4 = "0.14"
bytes = "1"
native-tls = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
tokio-native-tls = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
jpeg-encoder = "0.6"
image = { version = "=0.25.8", default-features = false }
fatfs = "0.3.6"
tempfile = "3.27"
sha2 = "0.10"
filetime = "0.2"
chrono = "0.4"
blowfish = { version = "0.10", features = ["zeroize"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
