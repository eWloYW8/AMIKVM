[package]
name = "amikvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
amikvm-core = { path = "../crates/amikvm-core" }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"
x11-dl = "2.21"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
